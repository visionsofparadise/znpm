name: Test

on:
   push:
      branches: [main]
   workflow_dispatch:

jobs:
   test:
      runs-on: ${{ matrix.os }}
      timeout-minutes: 20
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-latest, windows-latest, macos-latest]
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: "24"

         - run: npm install -g npm@12

         - run: npm ci

         - run: npm run check

         - run: npm run unit

         - run: npm run integration

         - if: matrix.os != 'macos-latest'
           run: npm run build

         - if: matrix.os != 'macos-latest'
           run: node smoke.mjs
