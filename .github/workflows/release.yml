name: Release

on:
   push:
      tags: ["v*"]

permissions:
   contents: read

jobs:
   test:
      runs-on: ${{ matrix.os }}
      timeout-minutes: 20
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-latest
                 targets: --target linux-x64
               - os: windows-latest
                 targets: --target windows-x64
               - os: macos-latest
                 targets: --target darwin-arm64 --target darwin-x64
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: "24"

         - run: npm install -g npm@12

         - run: npm ci

         - run: npm run check

         - run: npm run unit

         - run: npm run integration

         - run: node build.mjs ${{ matrix.targets }}

         - run: node smoke.mjs

         - uses: actions/upload-artifact@v4
           with:
              name: dist-${{ matrix.os }}
              path: dist/

   release:
      needs: test
      runs-on: ubuntu-latest
      timeout-minutes: 20
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@v4

         - uses: actions/download-artifact@v4
           with:
              pattern: dist-*
              merge-multiple: true
              path: dist/

         - run: sha256sum znpm-* npm-wrapper-* > SHA256SUMS
           working-directory: dist

         - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/* install.ps1 install.sh
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

         - run: gh release edit "$GITHUB_REF_NAME" --draft=false
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
