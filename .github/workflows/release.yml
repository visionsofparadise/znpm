name: Release

on:
   push:
      tags: ["v*"]

permissions:
   contents: read

jobs:
   test:
      runs-on: ${{ matrix.os }}
      timeout-minutes: 20
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-latest
                 targets: --target linux-x64 --target linux-arm64 --target linux-x64-musl --target linux-arm64-musl
               - os: windows-latest
                 targets: --target windows-x64 --target windows-arm64
               - os: macos-latest
                 targets: --target darwin-arm64 --target darwin-x64
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: "24"

         - run: npm install -g npm@12

         - run: npm ci

         - run: npm run check

         - run: npm run unit

         - run: npm run integration

         - run: node scripts/build.mjs ${{ matrix.targets }}

         - run: node scripts/smoke.mjs

         - if: matrix.os == 'macos-latest'
           run: sh scripts/installSmoke.sh dist

         - if: matrix.os == 'windows-latest'
           timeout-minutes: 10
           run: powershell -File scripts/installSmoke.ps1 -Dist dist

         - uses: actions/upload-artifact@v4
           with:
              name: dist-${{ matrix.os }}
              path: dist/

   containers:
      needs: test
      runs-on: ubuntu-latest
      timeout-minutes: 15
      strategy:
         fail-fast: false
         matrix:
            include:
               - image: node:24-bookworm-slim
                 user: root
                 home: /root
                 fetcher: absent
               - image: node:24-alpine
                 user: root
                 home: /root
                 fetcher: present
               - image: node:24-bookworm
                 user: node
                 home: /home/node
                 fetcher: present
      steps:
         - uses: actions/checkout@v4

         - uses: actions/download-artifact@v4
           with:
              name: dist-ubuntu-latest
              path: dist/

         - run: chmod +x dist/*

         - run: docker run --rm --user ${{ matrix.user }} -e HOME=${{ matrix.home }} -v "$PWD:/repo:ro" ${{ matrix.image }} sh /repo/scripts/installSmoke.sh /repo/dist

         - run: docker network create znpm-dist-net

         - run: sha256sum znpm-* npm-wrapper-* > SHA256SUMS
           working-directory: dist

         - run: docker run --rm --detach --name znpm-dist --network znpm-dist-net -v "$PWD/dist:/www:ro" busybox httpd -f -p 8000 -h /www

         - run: |
              set -eu
              log="$RUNNER_TEMP/install-download.log"
              status=0
              docker run --rm --network znpm-dist-net --user ${{ matrix.user }} -e HOME=${{ matrix.home }} -e ZNPM_HOME=/tmp/znpm-download -e ZNPM_BASE_URL=http://znpm-dist:8000 -v "$PWD:/repo:ro" ${{ matrix.image }} sh -c 'sh /repo/scripts/install.sh >/dev/null && exec /tmp/znpm-download/bin/znpm disable' >"$log" 2>&1 || status=$?
              cat "$log"
              if ! grep -qF 'downloading SHA256SUMS' "$log"; then
                 echo "install.sh took no download path with ZNPM_DIST unset" >&2
                 exit 1
              fi
              case "${{ matrix.fetcher }}" in
                 absent)
                    if [ "$status" -eq 0 ]; then
                       echo "install.sh reported success on an image carrying no fetcher" >&2
                       exit 1
                    fi
                    grep -qF 'znpm requires curl or wget.' "$log"
                    ;;
                 present)
                    if [ "$status" -ne 0 ]; then
                       echo "the downloaded install exited $status on an image that carries a fetcher" >&2
                       exit 1
                    fi
                    grep -qF 'verifying checksums' "$log"
                    grep -qE '^znpm-linux-(x64|arm64)(-musl)?: OK$' "$log"
                    ;;
                 *)
                    echo "the matrix row declares no fetcher" >&2
                    exit 1
                    ;;
              esac

   release:
      needs: [test, containers]
      runs-on: ubuntu-latest
      timeout-minutes: 20
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@v4

         - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

         - uses: actions/download-artifact@v4
           with:
              pattern: dist-*
              merge-multiple: true
              path: dist/

         - run: sha256sum znpm-* npm-wrapper-* > SHA256SUMS
           working-directory: dist

         - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/* scripts/install.ps1 scripts/install.sh
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

         - run: gh release edit "$GITHUB_REF_NAME" --draft=false
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

   publish:
      needs: release
      runs-on: ubuntu-latest
      timeout-minutes: 20
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"

         - run: npm install -g npm@12

         - uses: actions/download-artifact@v4
           with:
              pattern: dist-*
              merge-multiple: true
              path: dist/

         - run: chmod +x dist/*

         - id: check
           run: |
              VERSION=$(node -p "require('./package.json').version")
              PUBLISHED=$(npm view "@zcross/znpm@$VERSION" version 2>/dev/null || echo "")
              if [ "$PUBLISHED" = "$VERSION" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi

         - if: steps.check.outputs.skip == 'false'
           run: node scripts/packageNpm.mjs

         - if: steps.check.outputs.skip == 'false'
           run: |
              for directory in dist/npm/znpm-*; do
                npm publish --access public "$directory"
              done

         - if: steps.check.outputs.skip == 'false'
           run: npm publish --access public dist/npm/znpm
